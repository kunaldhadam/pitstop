{% extends "_base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}

{% block title %}Log In{% endblock title %}

{% block content %}
        <h2>Log In</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            {% include "socialaccount/snippets/provider_list.html" with process="login" %}
            <button class="btn btn-success" type="submit">Log In</button>
        </form>
{% endblock content %}
