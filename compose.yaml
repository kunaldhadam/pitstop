services:
  server:
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend/website
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://server:8000
    depends_on:
      server:
        condition: service_started

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pitstop_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitstop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  media_data:
